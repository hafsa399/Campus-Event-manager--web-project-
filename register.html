<!DOCTYPE html>
<html >
<head>
  <title>Event Registration</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
 <!--navbar div-->
  <div id="navbar"></div>
    
  <div class="form-card">
    <h1>Event Registration</h1>
    <form id="reg-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="name">Full Name*</label>
          <input type="text" id="name" name="fullName" placeholder="Enter Full Name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address*</label>
          <input type="email" id="email" name="email" placeholder="Enter Email" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="PhoneNo" placeholder="e.g. 03xxx">
        </div>
        <div class="form-group">
          <label>Gender</label>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="male"> Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
          </div>
        </div>
        <div class="form-group">
          <label for="event">Select Event*</label>
          <select id="event" name="event" onchange="updateFee()"  required>
            <option value="">-- Choose an Event --</option>
            <option value="tech">Tech Talk</option>
            <option value="cultural">Cultural Fest</option>
            <option value="sports">Sports Gala</option>
            <option value="AnnualDinner">AnnualDinner</option>
          </select>
        </div>
        <div class="form-group">
          <label for="eventFee">Fee</label>
          <input type="text" id="eventFee" name="eventFee"   readonly placeholder="auto">
        </div>
        <div class="form-group">
          <label>Payment Method*</label>
          <div class="radio-group">
            <label><input type="radio" name="payment" value="cash"> Cash</label>
            <label><input type="radio" name="payment" value="card"> Credit Card</label>
            <label><input type="radio" name="payment" value="jazzcash"> JazzCash</label>
            <label><input type="radio" name="payment" value="others"> Others</label>
          </div>
        </div>
        <div class="form-group full-width">
          <label for="notes">Additional Notes</label>
          <textarea id="notes" placeholder="Enter any notes..."></textarea>
        </div>
      </div>
      <button type="submit" class="submit-btn">Register</button>
    </form>
  </div>
  <script>
      fetch("nav.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;
        });
        function updateFee() {
         const eventDropdown=document.getElementById("event");  
        const feeInput=document.getElementById("eventFee");
  // defining fee for each event
  const fee={
    tech:"500 PKR",
    cultural:"300 PKR",
    sports:"350 PKR",
    AnnualDinner:"2000 PKR"
  };
// for select
  const selectedEvent=eventDropdown.value;

// for update
feeInput.value=fee[selectedEvent] || "";
        }
        const form=document.getElementById("reg-form");
        const fullNameInput=document.getElementById("name");
        const eventSelect=document.getElementById("event");

        form.addEventListener("submit",function (e){
          e.preventDefault();
         const Registration ={
          name:fullNameInput.value,
          event:eventSelect.value
         };
         // now save in local storage
         const savedRegistrations=JSON.parse(localStorage.getItem("registrations")) || [];
         const Registrations=Array.isArray(savedRegistrations) ? savedRegistrations : [savedRegistrations];
         Registrations.push(Registration);
         localStorage.setItem("registrations",JSON.stringify(Registrations));
         alert("registration successful!");
         form.reset();
                 });

        </script>
</body>
</html>
