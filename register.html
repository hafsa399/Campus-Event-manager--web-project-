<!DOCTYPE html>
<html >
<head>
  <title>Event Registration</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
 <!--navbar div-->
  <div id="navbar"></div>
    
  <div class="form-card">
    <h1>Event Registration</h1>
    <form id="reg-form" onsubmit="return validateForm()"  novalidate>
      <div class="form-grid">
        <div class="form-group">
          <label for="rollNo">Roll no*</label>
          <input type="text" id="rollNo" name="rollNo" placeholder="Enter Roll No"  >
          <span id="err-rollNo" class="error"></span>
        </div>
        <div class="form-group">
          <label for="fullName">Full Name*</label>
          <input type="text" id="fullName" name="fullName" placeholder="Enter Full Name"  >
         <span id="err-fullName" class="error"></span>
        </div>
        <div class="form-group">
          <label for="email">Email Address*</label>
          <input type="email" id="email" name="email" placeholder="Enter Email" >
          <span class="error-msg" id="err-email"></span>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="PhoneNo" placeholder="e.g. 03xxx">
        </div>
        <div class="form-group">
          <label>Gender</label>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="male"> Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
          </div>
        </div>
        <div class="form-group">
          <label for="event">Select Event*</label>
          <select id="event" name="event" onchange="updateFee()"  required>
            <option value="">-- Choose an Event --</option>
            <option value="tech">Tech Talk</option>
            <option value="cultural">Cultural Fest</option>
            <option value="sports">Sports Gala</option>
            <option value="AnnualDinner">AnnualDinner</option>
          </select>
         <span id="err-event" class="error"></span>
        </div>
        <div class="form-group">
          <label for="eventFee">Fee</label>
          <input type="text" id="eventFee" name="eventFee"   readonly placeholder="auto">
        </div>
        <div class="form-group">
          <label>Payment Method*</label>
          <div class="radio-group" aria-required="true">
            <label><input type="radio" name="payment" value="cash"> Cash</label>
            <label><input type="radio" name="payment" value="card"> Credit Card</label>
            <label><input type="radio" name="payment" value="jazzcash"> JazzCash</label>
            <label><input type="radio" name="payment" value="others"> Others</label>
          </div>
        </div>
        <div class="form-group full-width">
          <label for="notes">Additional Notes</label>
          <textarea id="notes" placeholder="Enter any notes..."></textarea>
        </div>
      </div>
      <p id="form-message"></p>
      <button type="submit" class="submit-btn">Register</button>
    </form>
  </div>
 <script src="register.js"></script>
</body>
</html>
