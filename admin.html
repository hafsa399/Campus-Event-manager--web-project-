<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>admin</title>
     <link href="admin.css" rel="stylesheet">
</head>
<body>

 <div id="navbar"></div>
<h1>Registrations</h1>
<table border="1" id="registrationsTable">
  <thead>
    <tr>
      <th>Name</th>
      <th>Event</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
       fetch("nav.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;
        });

window.onload = function() {
  const tableBody = document.querySelector("#registrationsTable tbody");
  const savedRegistrations = JSON.parse(localStorage.getItem("registrations")) || [];
  const registrations = Array.isArray(savedRegistrations) ? savedRegistrations : [savedRegistrations];

  registrations.forEach(reg => {
    const row = document.createElement("tr");
    row.innerHTML = `<td>${reg.name}</td><td>${reg.event}</td>`;
    tableBody.appendChild(row);
  });
};
</script>
</body>
</html>
